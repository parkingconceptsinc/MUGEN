name: Validate both MUGEN apps
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Exercise Studio and Audio Lab in a real browser
        env:
          MUGEN_TEST_URL: http://127.0.0.1:4173/MUGEN/
          MUGEN_ARTIFACT_DIR: /tmp/mugen-browser
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mugen-preview.log 2>&1 &
          node tests/browser-studio-audiolab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MUGEN-creative-browser-reports
          path: |
            /tmp/mugen-browser
            /tmp/mugen-preview.log
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/check-release.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test, lint and assemble APK from the same revision
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MUGEN-Android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MUGEN-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
