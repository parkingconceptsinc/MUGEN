name: Publish Android APK

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required repository Actions secret: ${secret_name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mugen-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mortimer-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/mortimer-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated."
      - name: Derive Android version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must look like android-v0.9.1"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if (( major > 20 || minor > 99 || patch > 99 )); then
            echo "::error::Version is outside the supported Android version-code range."
            exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Test and build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleRelease -PandroidVersionCode=${{ steps.version.outputs.code }} -PandroidVersionName=${{ steps.version.outputs.name }}
      - name: Verify signed APK and generate checksum
        working-directory: android
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk" || { echo "::error::Release APK is missing or empty."; exit 1; }
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path" || { echo "::error::Android apksigner tool was not found."; exit 1; }
          "$apksigner_path" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | awk '{ print $1 "  app-release.apk" }' > "$apk.sha256"
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: MUGEN APK v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
