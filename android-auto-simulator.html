<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><title>MUGEN Android Auto Simulator</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--line:#283443;--muted:#9aa8bb;--text:#f4f7fb;--accent:#a4ff5a}*{box-sizing:border-box}body{margin:0;background:#080b10;color:var(--text);font:14px/1.4 system-ui,sans-serif}.screen{height:100dvh;min-height:240px;position:relative;overflow:hidden;display:grid;grid-template-columns:58px 1fr;background:radial-gradient(ellipse at 70% 10%,#1a2b32,transparent 58%),#080b10}.rail{background:#111720;border-right:1px solid #27303b;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 5px}.rail button{border:0;width:42px;height:42px;border-radius:13px;background:transparent;color:#a4b0c1;font-size:21px}.rail button.active{background:#263c29;color:var(--accent);box-shadow:inset 0 0 0 1px #719f4b}.rail .bottom{margin-top:auto}.main{padding:clamp(12px,3vw,26px);padding-top:30px;display:grid;grid-template-columns:minmax(90px,.8fr) minmax(0,1.3fr);gap:clamp(12px,2.5vw,26px);align-items:center;min-width:0}.art{aspect-ratio:1;border-radius:15px;background:linear-gradient(145deg,#273e49,#121a2b 55%,#263b24);display:grid;place-items:center;font-size:clamp(40px,8vw,76px);box-shadow:inset 0 0 0 1px #ffffff12;width:100%;max-width:220px}.now{min-width:0}.label{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}.track{font-size:clamp(16px,2.6vw,26px);font-weight:750;letter-spacing:-.03em;line-height:1.12;margin:7px 0;overflow-wrap:anywhere}.artist{color:#aab5c5;font-size:clamp(11px,1.5vw,14px)}.progress{height:4px;background:#2a3441;border-radius:99px;margin:16px 0 7px;overflow:hidden}.progress span{display:block;height:100%;width:35%;background:var(--accent)}.times{display:flex;justify-content:space-between;color:#8795a8;font-size:10px}.controls{display:flex;align-items:center;gap:clamp(6px,1.5vw,15px);margin-top:13px}.controls button{border:0;color:#f2f6fa;background:#202a36;border-radius:50%;width:clamp(29px,5vw,42px);height:clamp(29px,5vw,42px);font-size:16px}.controls .play{width:clamp(39px,6vw,52px);height:clamp(39px,6vw,52px);background:var(--accent);color:#10150b;font-weight:900}.status{position:absolute;top:7px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:10px;color:#d6dfeb;pointer-events:none}.footer{position:absolute;bottom:5px;left:72px;right:12px;display:flex;justify-content:space-between;color:#77869a;font-size:9px;pointer-events:none}.message{position:absolute;left:72px;bottom:23px;right:12px;color:#aebaca;font-size:10px;min-height:12px}@media(max-width:380px){.screen{grid-template-columns:46px 1fr}.rail{padding:8px 3px;gap:7px}.rail button{width:35px;height:35px}.main{grid-template-columns:minmax(65px,.7fr) minmax(0,1.3fr);gap:9px;padding:9px;padding-top:25px}.footer,.message{left:55px}.progress{margin:9px 0 5px}.controls{margin-top:8px}}
</style></head><body><main class="screen"><nav class="rail" aria-label="Media navigation"><button class="active" data-mode="now" aria-label="Now playing">♫</button><button data-mode="browse" aria-label="Browse">▤</button><button data-mode="search" aria-label="Search">⌕</button><button class="bottom" data-mode="home" aria-label="Home">⌂</button></nav><section class="main"><div class="art" aria-hidden="true">♫</div><div class="now"><div class="label" id="label">Now playing · MUGEN</div><div class="track" id="track">Your music, at a glance</div><div class="artist" id="artist">Native media session not connected to this prototype</div><div class="progress"><span id="bar"></span></div><div class="times"><span>1:24</span><span>4:02</span></div><div class="controls"><button id="prev" aria-label="Previous">|◀</button><button id="play" class="play" aria-label="Play demo">▶</button><button id="next" aria-label="Next">▶|</button><button id="shuffle" aria-label="Shuffle">⤨</button></div></div></section><div class="status"><span id="clock">10:27</span><span>▮▮▮　▰　◉</span></div><div class="message" id="message" aria-live="polite">Prototype controls only — no audio is playing.</div><div class="footer"><span>MUGEN demo</span><span>Keep eyes on the road</span></div></main><script>
const samples=[["Your music, at a glance","Native media session not connected to this prototype"],["Demo Library · Albums","Example browse screen · sample content"],["Search MUGEN","Search UI prototype · no real library query"],["MUGEN Home","Home navigation prototype"]];let i=0,play=false,p=35;const $=x=>document.getElementById(x);function draw(){const t=samples[i];$('track').textContent=t[0];$('artist').textContent=t[1];$('label').textContent=['Now playing · MUGEN','Browse · MUGEN','Search · MUGEN','Home · MUGEN'][i];$('play').textContent=play?'Ⅱ':'▶';$('bar').style.width=p+'%';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===['now','browse','search','home'][i]));$('message').textContent=play?'Demo state: playing (visual only).':'Prototype controls only — no audio is playing.'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{i=['now','browse','search','home'].indexOf(b.dataset.mode);draw()});$('play').onclick=()=>{play=!play;draw()};$('next').onclick=()=>{i=(i+1)%samples.length;p=0;draw()};$('prev').onclick=()=>{i=(i+samples.length-1)%samples.length;p=0;draw()};$('shuffle').onclick=()=>{i=Math.floor(Math.random()*samples.length);draw()};try{$('clock').textContent=new Intl.DateTimeFormat([],{hour:'numeric',minute:'2-digit'}).format(new Date())}catch(e){}draw();
</script></body></html>
